name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build + validate (unsigned)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Lint JSON manifests
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("mcpb/manifest.json"))'
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/marketplace.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("npm-package/package.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("npm-package/server.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("mcpb/package.json"))'

      - name: Cross-check versions
        run: |
          MCPB_V=$(node -p 'require("./mcpb/manifest.json").version')
          NPM_V=$(node -p 'require("./npm-package/package.json").version')
          PLUGIN_V=$(node -p 'require("./.claude-plugin/plugin.json").version')
          SERVER_JSON_V=$(node -p 'require("./npm-package/server.json").version')
          MCPB_PKG_V=$(node -p 'require("./mcpb/package.json").version')
          echo "mcpb/manifest.json: $MCPB_V"
          echo "npm-package/package.json: $NPM_V"
          echo ".claude-plugin/plugin.json: $PLUGIN_V"
          echo "npm-package/server.json: $SERVER_JSON_V"
          echo "mcpb/package.json: $MCPB_PKG_V"
          if [[ "$MCPB_V" != "$NPM_V" || "$NPM_V" != "$PLUGIN_V" || "$PLUGIN_V" != "$SERVER_JSON_V" || "$SERVER_JSON_V" != "$MCPB_PKG_V" ]]; then
            echo "Version drift detected across manifests" >&2
            exit 1
          fi

      - name: Validate mcpb manifest
        run: mcpb validate mcpb/manifest.json || mcpb validate mcpb

      - name: Build unsigned binary + skill + mcpb
        run: ./build.sh

      - name: Verify npm package builds
        run: |
          cd npm-package
          npm install --no-audit --no-fund --ignore-scripts
          # Don't actually publish; just verify the tarball packs.
          npm pack --dry-run
          # Every module the postinstall imports must be in `files`, or the
          # published tarball fails at import time on a fresh install.
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.env.RUNNER_TEMP + "/pack.json")[0]
              .files.map((f) => f.path);
            for (const required of [
              "scripts/install-binary.js",
              "scripts/verify-signature.js",
            ]) {
              if (!files.includes(required)) {
                console.error(`${required} missing from npm tarball`);
                process.exit(1);
              }
            }
          '

      - name: Verify hooks/install-binary.sh is valid bash
        run: |
          bash -n scripts/install-binary.sh
          bash -n scripts/notarize.sh
          bash -n scripts/verify-signature.sh

      # The signer check is the one install step an unsigned CI build cannot
      # exercise — and getting it wrong bricks every single install (issues
      # #2, #3, where `codesign -dv` never prints the `Authority=` line the
      # old check grepped for). Pin a known-good, Developer ID-signed release
      # asset and assert both installers accept it. A negative test alone
      # would not catch this: a malformed requirement makes codesign reject
      # everything, so only a positive case proves the check still passes
      # genuine binaries.
      - name: Signer check accepts a genuine signed binary
        run: |
          REF=v1.0.3   # any published release works; pinned so CI does not
                       # depend on the version currently under development
          curl --fail --silent --location --output "$RUNNER_TEMP/ref-binary" \
            "https://github.com/high5-ventures/apple-reminders-for-claude/releases/download/$REF/reminders-eventkit"
          chmod +x "$RUNNER_TEMP/ref-binary"
          ./scripts/verify-signature.sh "$RUNNER_TEMP/ref-binary"
          node npm-package/scripts/verify-signature.js "$RUNNER_TEMP/ref-binary"

      - name: Signer requirement is identical across both install paths
        run: |
          # The requirement is a security constant duplicated in bash and JS.
          # Enforce equality instead of trusting a "keep in sync" comment.
          SH=$(sed -n "s/^REQUIREMENT='\(.*\)'$/\1/p" scripts/verify-signature.sh)
          JS=$(node -e 'import("./npm-package/scripts/verify-signature.js").then(m => console.log(m.REQUIREMENT))')
          if [[ -z "$SH" ]]; then
            echo "could not extract REQUIREMENT from scripts/verify-signature.sh" >&2
            exit 1
          fi
          if [[ "$SH" != "$JS" ]]; then
            echo "signer requirement drifted between install paths:" >&2
            echo "  sh: $SH" >&2
            echo "  js: $JS" >&2
            exit 1
          fi

      - name: Signer check rejects a foreign signature
        run: |
          # Ad-hoc signed: the signature is intact, but it is not ours. Both
          # installers must refuse it.
          cp dist/reminders-eventkit "$RUNNER_TEMP/adhoc-binary"
          codesign --force --sign - "$RUNNER_TEMP/adhoc-binary"
          if ./scripts/verify-signature.sh "$RUNNER_TEMP/adhoc-binary" 2>/dev/null; then
            echo "verify-signature.sh accepted an ad-hoc signed binary" >&2
            exit 1
          fi
          if node npm-package/scripts/verify-signature.js "$RUNNER_TEMP/adhoc-binary" 2>/dev/null; then
            echo "verify-signature.js accepted an ad-hoc signed binary" >&2
            exit 1
          fi

      - name: Check no duplicated server source
        run: |
          # mcpb/server must NOT exist — server code lives only in npm-package/.
          if [[ -d mcpb/server ]]; then
            echo "mcpb/server/ should not exist — single-source-of-truth is npm-package/server/" >&2
            exit 1
          fi

      # KNOWN BROKEN — quarantined, deliberately not deleted.
      #
      # This step has never passed. On a headless runner the binary blocks
      # indefinitely inside the EventKit access request, so the job burned its
      # full 20-minute timeout and was cancelled — on every CI run since the
      # workflow was introduced. Every step that used to follow it was skipped
      # every time, which is why nothing caught the signer check that could
      # never match (issues #2, #3).
      #
      # It now runs last, bounded, and non-blocking, so one broken step stops
      # masking the rest of the suite. The hang is a real bug in the binary's
      # access request and is tracked separately — do not delete this step to
      # make CI green.
      - name: Smoke-test binary (list-lists)
        continue-on-error: true
        run: |
          # The binary has no TCC grant here; it should still validate its
          # argv and exit with a JSON envelope rather than hang or crash.
          set +e
          OUTPUT=$(timeout 120 ./dist/reminders-eventkit list-lists 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [[ $EXIT -eq 124 ]]; then
            echo "KNOWN BUG: binary hung in the EventKit access request, killed after 120s" >&2
            exit 1
          fi
          echo "$OUTPUT" | grep -Eq '"status":"(ok|error)"' \
            || { echo "Binary did not emit JSON envelope"; exit 1; }
