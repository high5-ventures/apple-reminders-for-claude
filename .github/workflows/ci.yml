name: CI

# Light checks only: Linux, no Swift build. Everything that compiles the
# binary or needs macOS lives in build.yml, which runs through ci-batch.yml
# after merges instead of on every pull request (#20).
on:
  pull_request:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".github/workflows/**"
      - "build.sh"
      - "hooks/**"
      - "mcpb/**"
      - "npm-package/**"
      - "scripts/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  # A literal prefix rather than github.workflow, which inside a called
  # workflow resolves to the caller's name.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Lint JSON manifests
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("mcpb/manifest.json"))'
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/marketplace.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("npm-package/package.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("npm-package/server.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("mcpb/package.json"))'

      - name: Cross-check versions
        run: |
          MCPB_V=$(node -p 'require("./mcpb/manifest.json").version')
          NPM_V=$(node -p 'require("./npm-package/package.json").version')
          PLUGIN_V=$(node -p 'require("./.claude-plugin/plugin.json").version')
          SERVER_JSON_V=$(node -p 'require("./npm-package/server.json").version')
          MCPB_PKG_V=$(node -p 'require("./mcpb/package.json").version')
          echo "mcpb/manifest.json: $MCPB_V"
          echo "npm-package/package.json: $NPM_V"
          echo ".claude-plugin/plugin.json: $PLUGIN_V"
          echo "npm-package/server.json: $SERVER_JSON_V"
          echo "mcpb/package.json: $MCPB_PKG_V"
          if [[ "$MCPB_V" != "$NPM_V" || "$NPM_V" != "$PLUGIN_V" || "$PLUGIN_V" != "$SERVER_JSON_V" || "$SERVER_JSON_V" != "$MCPB_PKG_V" ]]; then
            echo "Version drift detected across manifests" >&2
            exit 1
          fi

      - name: Validate mcpb manifest
        run: mcpb validate mcpb/manifest.json || mcpb validate mcpb

      - name: JavaScript parses
        run: |
          for f in npm-package/server/index.js npm-package/bin/*.js npm-package/scripts/*.js; do
            node --check "$f"
          done

      - name: Shell scripts parse
        run: |
          for f in build.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: Verify npm package builds
        run: |
          cd npm-package
          # --force only gets past `"os": ["darwin"]` on this Linux runner; the
          # lockfile still pins every version.
          npm ci --no-audit --no-fund --ignore-scripts --force
          # Don't actually publish; just verify the tarball packs.
          npm pack --dry-run
          # Every module the postinstall imports must be in `files`, or the
          # published tarball fails at import time on a fresh install.
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.env.RUNNER_TEMP + "/pack.json")[0]
              .files.map((f) => f.path);
            for (const required of [
              "scripts/install-binary.js",
              "scripts/verify-signature.js",
            ]) {
              if (!files.includes(required)) {
                console.error(`${required} missing from npm tarball`);
                process.exit(1);
              }
            }
          '

      # Talks MCP to the real server: the tools it serves must match the ones
      # mcpb/manifest.json declares, and every parameter needs a description
      # for the model to go on (#19). Listing tools never runs the binary.
      - name: Server lists every tool with documented parameters
        working-directory: npm-package
        env:
          REMINDERS_BINARY: /usr/bin/false
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";

            const client = new Client({ name: "ci", version: "0" });
            await client.connect(new StdioClientTransport({
              command: process.execPath,
              args: ["server/index.js"],
              env: { ...process.env },
            }));
            const { tools } = await client.listTools();
            await client.close();

            const manifest = JSON.parse(readFileSync("../mcpb/manifest.json", "utf8"));
            const served = tools.map((t) => t.name).sort().join(" ");
            const declared = manifest.tools.map((t) => t.name).sort().join(" ");
            if (served !== declared) {
              console.error(`server tools differ from mcpb/manifest.json:\n  served:   ${served}\n  manifest: ${declared}`);
              process.exit(1);
            }
            const undocumented = tools.flatMap((t) =>
              Object.entries(t.inputSchema.properties ?? {})
                .filter(([, p]) => !p.description)
                .map(([name]) => `${t.name}.${name}`));
            if (undocumented.length) {
              console.error(`parameters without a description: ${undocumented.join(", ")}`);
              process.exit(1);
            }
            console.log(`${tools.length} tools, all parameters documented`);
          '

      - name: Signer requirement is identical across both install paths
        run: |
          # The requirement is a security constant duplicated in bash and JS.
          # Enforce equality instead of trusting a "keep in sync" comment.
          SH=$(sed -n "s/^REQUIREMENT='\(.*\)'$/\1/p" scripts/verify-signature.sh)
          JS=$(node -e 'import("./npm-package/scripts/verify-signature.js").then(m => console.log(m.REQUIREMENT))')
          if [[ -z "$SH" ]]; then
            echo "could not extract REQUIREMENT from scripts/verify-signature.sh" >&2
            exit 1
          fi
          if [[ "$SH" != "$JS" ]]; then
            echo "signer requirement drifted between install paths:" >&2
            echo "  sh: $SH" >&2
            echo "  js: $JS" >&2
            exit 1
          fi

      - name: Check no duplicated server source
        run: |
          # mcpb/server must NOT exist — server code lives only in npm-package/.
          if [[ -d mcpb/server ]]; then
            echo "mcpb/server/ should not exist — single-source-of-truth is npm-package/server/" >&2
            exit 1
          fi
