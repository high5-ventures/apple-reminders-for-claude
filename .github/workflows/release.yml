name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
      publish:
        description: 'Publish the release. Set to false for a signed, notarized test build that is uploaded as a workflow artifact only — nothing reaches GitHub Releases, npm, or the MCP Registry.'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Derive release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Resolved here as a string rather than guarding steps on
          # `inputs.publish` directly: in GitHub expressions an unset input is
          # the empty string, and `'' == false` is true, so a tag push would
          # silently skip publishing. A tag push always publishes; only an
          # explicit dispatch with publish=false produces a test build.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "false" ]]; then
            PUBLISH=false
          else
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG version=$VERSION publish=$PUBLISH"

      - name: Verify manifest versions match tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for f in mcpb/manifest.json mcpb/package.json npm-package/package.json npm-package/server.json .claude-plugin/plugin.json; do
            jq -er --arg v "$VERSION" --arg f "$f" \
              'if .version == $v then true else error("\($f) version \(.version) ≠ tag \($v)") end' "$f"
          done

      # actions/setup-node@v6.4.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain-db
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application: high5 ventures GmbH/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "No 'Developer ID Application: high5 ventures GmbH' identity found in keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build signed Swift binary
        run: ./build.sh binary

      - name: Verify binary signature
        run: |
          codesign --verify --verbose dist/reminders-eventkit
          spctl --assess --type execute --verbose dist/reminders-eventkit || true
          codesign -dv --entitlements :- dist/reminders-eventkit
          # Without this entitlement macOS 26+ refuses the Reminders request on
          # a hardened-runtime binary before any dialog can appear.
          codesign -d --entitlements :- dist/reminders-eventkit 2>/dev/null \
            | grep -q 'com.apple.security.personal-information.reminders' \
            || { echo "Reminders entitlement missing from signed binary" >&2; exit 1; }
          # Gate the release on the installers' own signer check: if this
          # binary would not be accepted by scripts/install-binary.sh or the
          # npm postinstall, publishing it ships a broken install.
          ./scripts/verify-signature.sh dist/reminders-eventkit
          node npm-package/scripts/verify-signature.js dist/reminders-eventkit

      - name: Build .mcpb bundle
        run: ./build.sh mcpb

      - name: Notarize .mcpb bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize.sh dist/apple-reminders.mcpb

      - name: Validate bundle integrity
        run: |
          ~/.local/bin/mcpb validate mcpb/manifest.json || mcpb validate mcpb/manifest.json
          # .mcpb cannot be stapled (see scripts/notarize.sh) — verify the
          # bundled binary's hardened-runtime signature instead.
          unzip -p dist/apple-reminders.mcpb bin/reminders-eventkit > /tmp/bin-extract
          chmod +x /tmp/bin-extract
          codesign --verify --verbose /tmp/bin-extract

      # Always uploaded, so a `publish=false` dispatch yields an installable
      # signed + notarized bundle for testing without anything reaching
      # GitHub Releases, npm, or the MCP Registry.
      # actions/upload-artifact@v7.0.1
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-reminders-${{ steps.version.outputs.tag }}
          path: |
            dist/apple-reminders.mcpb
            dist/reminders-eventkit
          if-no-files-found: error
          retention-days: 14

      # GitHub Release MUST be created BEFORE the npm package is published.
      # The npm postinstall fetches the binary from this release URL; if npm
      # publishes first and the release step then fails, the npm version is
      # immutable and broken for fresh installs.
      # softprops/action-gh-release@v3.0.0
      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .github/release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/apple-reminders.mcpb
            dist/reminders-eventkit

      - name: Stage npm-package with signed binary
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p npm-package/bin
          cp dist/reminders-eventkit npm-package/bin/reminders-eventkit
          cd npm-package
          npm install --no-audit --no-fund --ignore-scripts

      # Trusted publishing: npm authenticates against this workflow's OIDC
      # identity (hence `id-token: write` above), so there is deliberately no
      # NODE_AUTH_TOKEN here. The trust is configured on npmjs.com against this
      # repository and this workflow filename; renaming this file breaks
      # publishing until the configuration is updated to match.
      - name: Publish npm package
        if: steps.version.outputs.publish == 'true'
        run: |
          # An npm older than 11.5.1 ignores OIDC and silently falls back to
          # token auth, which then fails as an unrelated-looking 404. Assert the
          # version instead of discovering that at publish time.
          npm install -g npm@latest
          REQUIRED=11.5.1
          ACTUAL=$(npm --version)
          if [[ "$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | head -1)" != "$REQUIRED" ]]; then
            echo "npm $ACTUAL cannot use trusted publishing (need >= $REQUIRED)" >&2
            exit 1
          fi
          echo "publishing with npm $ACTUAL via OIDC"

          cd npm-package
          # The published tarball must NOT include the local binary — end users
          # download it via the postinstall script. Remove before pack.
          rm -f bin/reminders-eventkit

          # npm versions are immutable, so re-running a release that got part
          # way through must not fail here. Publishing is the step most likely
          # to have already succeeded when a later one did not.
          PKG=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already published — skipping"
            exit 0
          fi

          # Provenance is attested automatically under trusted publishing; no
          # --provenance flag needed.
          npm publish --access public

      - name: Install mcp-publisher (pinned + checksum-verified)
        if: steps.version.outputs.publish == 'true'
        run: |
          MCP_PUBLISHER_VERSION=v1.8.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          ASSET="mcp-publisher_${OS}_${ARCH}.tar.gz"

          # Hashes from registry_1.8.1_checksums.txt. Update on bump.
          # `case` instead of `declare -A` so this works on Bash 3.2 (macOS).
          case "${OS}_${ARCH}" in
            darwin_arm64) EXPECTED=e45e520892460732a4bdf37255576415d4a53ec171f8b913faf15bb1aef7cb77 ;;
            darwin_amd64) EXPECTED=88126981225e7714fcc6b7a10cdba4a80ae5901e9740a8c06d0d5195c8bc294c ;;
            linux_arm64)  EXPECTED=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
            linux_amd64)  EXPECTED=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
            *) echo "no pinned checksum for ${OS}_${ARCH}" >&2; exit 1 ;;
          esac

          curl -fsSL -o "$RUNNER_TEMP/$ASSET" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}"

          echo "${EXPECTED}  $RUNNER_TEMP/$ASSET" | shasum -a 256 -c -

          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/$ASSET" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"

      - name: Publish to MCP Registry
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd npm-package
          # mcp-publisher needs interactive github-oauth; for CI we use the
          # GitHub Actions OIDC flow via the mcp-publisher github-oidc method.
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain build.keychain-db || true
