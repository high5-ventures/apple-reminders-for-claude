name: Build (macOS)

# Everything that compiles the binary or needs a macOS runner. Deliberately not
# triggered by pushes or pull requests (#20): ci-batch.yml calls it after
# merges, and it can be dispatched by hand against a branch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + validate (unsigned)
    # Own Apple Silicon runner: a fresh macOS VM per job, Xcode 27 only (#27).
    # ci-lint: allow-CI006  Fork-PR-Approval: all external contributors; ephemere VM pro Job
    runs-on: macrunner
    timeout-minutes: 20
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Select Xcode 27
        run: ./scripts/select-xcode.sh 27

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      # build.sh itself refuses a binary that lacks a requested architecture
      # or requires a newer macOS than 11.0.
      - name: Build unsigned binary + skill + mcpb
        run: ./build.sh

      # The signer check is the one install step an unsigned CI build cannot
      # exercise — and getting it wrong bricks every single install (issues
      # #2, #3, where `codesign -dv` never prints the `Authority=` line the
      # old check grepped for). Pin a known-good, Developer ID-signed release
      # asset and assert both installers accept it. A negative test alone
      # would not catch this: a malformed requirement makes codesign reject
      # everything, so only a positive case proves the check still passes
      # genuine binaries.
      - name: Signer check accepts a genuine signed binary
        run: |
          REF=v1.0.3   # any published release works; pinned so CI does not
                       # depend on the version currently under development
          curl --fail --silent --location --output "$RUNNER_TEMP/ref-binary" \
            "https://github.com/high5-ventures/apple-reminders-for-claude/releases/download/$REF/reminders-eventkit"
          chmod +x "$RUNNER_TEMP/ref-binary"
          ./scripts/verify-signature.sh "$RUNNER_TEMP/ref-binary"
          node npm-package/scripts/verify-signature.js "$RUNNER_TEMP/ref-binary"

      - name: Signer check rejects a foreign signature
        run: |
          # Ad-hoc signed: the signature is intact, but it is not ours. Both
          # installers must refuse it.
          cp dist/reminders-eventkit "$RUNNER_TEMP/adhoc-binary"
          codesign --force --sign - "$RUNNER_TEMP/adhoc-binary"
          if ./scripts/verify-signature.sh "$RUNNER_TEMP/adhoc-binary" 2>/dev/null; then
            echo "verify-signature.sh accepted an ad-hoc signed binary" >&2
            exit 1
          fi
          if node npm-package/scripts/verify-signature.js "$RUNNER_TEMP/adhoc-binary" 2>/dev/null; then
            echo "verify-signature.js accepted an ad-hoc signed binary" >&2
            exit 1
          fi

      - name: Binary carries the Reminders usage description
        run: |
          # A bare executable has no bundle: without the linked
          # __TEXT,__info_plist section macOS refuses Reminders access before
          # EventKit is reached, with no dialog and no System Settings entry.
          for key in NSRemindersUsageDescription NSRemindersFullAccessUsageDescription; do
            grep -q "$key" dist/reminders-eventkit \
              || { echo "$key missing from embedded Info.plist" >&2; exit 1; }
          done

      # Un-quarantined: this step used to hang forever inside the EventKit
      # access request and cancel the whole job at its 20-minute timeout. The
      # request is now bounded, so a runner without a TCC grant gets a prompt
      # answer instead of a deadlock.
      - name: Smoke-test binary (list-lists)
        env:
          REMINDERS_TCC_TIMEOUT_SECONDS: 5
        run: |
          # No TCC grant on a headless runner, so the expected outcome is a
          # permission error — but it must arrive as a JSON envelope, quickly.
          # macOS ships no GNU `timeout`; perl's alarm survives exec and is
          # always present. A fired alarm kills the child with SIGALRM -> 142.
          set +e
          OUTPUT=$(perl -e 'alarm 60; exec @ARGV' ./dist/reminders-eventkit list-lists 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [[ $EXIT -eq 142 ]]; then
            echo "Binary hung in the EventKit access request despite the bounded wait" >&2
            exit 1
          fi
          echo "$OUTPUT" | grep -Eq '"status":"(ok|error)"' \
            || { echo "Binary did not emit JSON envelope"; exit 1; }

      # The runner is Apple Silicon, so the smoke test above only ran the
      # arm64 slice. Launch the Intel slice under Rosetta (#21); an unknown
      # command answers before EventKit is touched.
      - name: Smoke-test the x86_64 slice
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 is not installed on this runner; the x86_64 slice was not launched"
            exit 0
          fi
          # Pre-setting the guard skips the TCC re-exec, so the check stays
          # on the x86_64 slice instead of possibly handing over to arm64.
          set +e
          OUTPUT=$(REMINDERS_EVENTKIT_TCC_DISCLAIMED=1 arch -x86_64 ./dist/reminders-eventkit no-such-command 2>&1)
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '"code":"UNKNOWN_COMMAND"' \
            || { echo "x86_64 slice did not run" >&2; exit 1; }

      # tccd checks a grant's code requirement against the whole executable.
      # The linker ad-hoc signs only the arm64 slice, so against
      # dist/reminders-eventkit every requirement fails ("Failed to match
      # existing code requirement") and only the first call, before tccd has
      # stored one, gets access. The test runs a copy signed in all slices.
      - name: Sign a test copy of the binary
        run: |
          cp dist/reminders-eventkit "$RUNNER_TEMP/reminders-eventkit"
          codesign --force --sign - "$RUNNER_TEMP/reminders-eventkit"
          codesign --verify --all-architectures "$RUNNER_TEMP/reminders-eventkit"

      # Everything above stops at the permission request. The job VMs run with
      # SIP disabled, so TCC's databases are writable: grant Reminders access
      # by path with a code requirement, as clicking "Allow" would. On macOS
      # 27 the user's tccd reads these grants from a database in a
      # ProtectedSystem container; a row in
      # ~/Library/Application Support/com.apple.TCC/TCC.db has no effect.
      - name: Grant Reminders access
        run: |
          csrutil status | grep -q disabled
          DBS=$(sudo find /private/var/containers/Data/ProtectedSystem \
            -path '*/Library/Application Support/com.apple.TCC/TCC.db' 2>/dev/null)
          [[ -n "$DBS" ]] || { echo "no TCC database in a ProtectedSystem container" >&2; exit 1; }
          echo "$DBS" > "$RUNNER_TEMP/tcc-dbs"
          identifier() { codesign -dv "$@" 2>&1 | sed -n 's/^Identifier=//p'; }
          requirement() {
            echo "requirement: $1" >&2
            csreq -r "=$1" -b "$RUNNER_TEMP/req.bin"
            xxd -p "$RUNNER_TEMP/req.bin" | tr -d '\n'
          }
          BIN="$RUNNER_TEMP/reminders-eventkit"
          ID=$(identifier -a "$(uname -m)" "$BIN")
          [[ -n "$ID" ]] || { echo "no code signing identifier in the $(uname -m) slice" >&2; exit 1; }
          BIN_REQ=$(requirement "identifier \"$ID\"")
          while IFS= read -r DB; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq)
              VALUES ('kTCCServiceReminders', '$BIN', 1, 2, 4, 1, X'$BIN_REQ');"
          done <<< "$DBS"
          REMINDERS_TCC_TIMEOUT_SECONDS=10 "$BIN" list-lists | tee "$RUNNER_TEMP/lists.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/lists.json"

      - name: Reminders round trip through EventKit (#31)
        working-directory: npm-package
        env:
          REMINDERS_BINARY: ${{ runner.temp }}/reminders-eventkit
          REMINDERS_TCC_TIMEOUT_SECONDS: 10
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node test/eventkit-integration.mjs

      - name: TCC diagnostics
        if: failure()
        run: |
          [[ -f "$RUNNER_TEMP/tcc-dbs" ]] || exit 0
          while IFS= read -r DB; do
            sudo sqlite3 "$DB" "SELECT client, auth_value, hex(csreq) FROM access WHERE service = 'kTCCServiceReminders';" \
              | while IFS='|' read -r CLIENT AUTH REQ; do
                  echo "$REQ" | xxd -r -p > "$RUNNER_TEMP/stored-req.bin"
                  echo "$CLIENT auth_value=$AUTH requirement: $(csreq -r "$RUNNER_TEMP/stored-req.bin" -t 2>&1)"
                done
          done < "$RUNNER_TEMP/tcc-dbs"
          /usr/bin/log show --last 6m --style compact \
            --predicate 'subsystem == "com.apple.TCC" AND (eventMessage CONTAINS[c] "Reminders" OR eventMessage CONTAINS[c] "reminders-eventkit")' \
            | tail -150

  # Rosetta above only shows that the Intel slice launches. This job runs it on
  # Intel hardware, through EventKit up to the permission request, and through
  # the path that failed in #21: the Node server spawning the binary.
  # macos-15-intel is GitHub's last x86_64 image, available until August 2027.
  # A headless runner cannot grant Reminders access, so a permission error
  # envelope is the expected answer.
  intel:
    name: Intel (x86_64) build + smoke test
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Runner is Intel
        run: |
          ARCH=$(uname -m)
          echo "uname -m: $ARCH"
          [[ "$ARCH" == "x86_64" ]] \
            || { echo "expected an x86_64 runner, got $ARCH" >&2; exit 1; }

      # What a contributor on an Intel Mac runs: both slices, arm64
      # cross-compiled.
      - name: Build universal binary on Intel
        run: ./build.sh binary

      - name: Smoke-test binary natively (list-lists)
        env:
          REMINDERS_TCC_TIMEOUT_SECONDS: 5
        run: |
          set +e
          OUTPUT=$(perl -e 'alarm 60; exec @ARGV' ./dist/reminders-eventkit list-lists 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [[ $EXIT -eq 142 ]]; then
            echo "Binary hung in the EventKit access request despite the bounded wait" >&2
            exit 1
          fi
          echo "$OUTPUT" | grep -Eq '"status":"(ok|error)"' \
            || { echo "Binary did not emit JSON envelope"; exit 1; }

      # #21 surfaced as "Binary crashed (exit 1): spawn Unknown system error
      # -86": Node could not spawn an arm64-only binary. A WRAPPER_* code here
      # means the server could not run the binary.
      - name: Server runs the binary on Intel (#21)
        working-directory: npm-package
        env:
          REMINDERS_BINARY: ${{ github.workspace }}/dist/reminders-eventkit
          REMINDERS_TCC_TIMEOUT_SECONDS: 5
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node --input-type=module -e '
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";

            const client = new Client({ name: "ci", version: "0" });
            await client.connect(new StdioClientTransport({
              command: process.execPath,
              args: ["server/index.js"],
              env: { ...process.env },
            }));
            const result = await client.callTool({ name: "get_lists", arguments: {} });
            await client.close();

            const text = result.content[0].text;
            console.log(text);
            const envelope = JSON.parse(text);
            if (!["ok", "error"].includes(envelope.status)
                || String(envelope.code ?? "").startsWith("WRAPPER_")) {
              console.error("the server could not run the binary on this Intel runner");
              process.exit(1);
            }
          '
